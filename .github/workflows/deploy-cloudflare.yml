name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    # PRs still run build + verify; production deploy only on pushes to main (see step if:).
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify mobile routing rules (unit + chain, no production fetch)
        run: node scripts/verify-mobile-redirects.mjs

      - name: Verify build uses JS Vite (not Debian /usr/bin/vite)
        run: node scripts/npm-scripts-verify.mjs ci

      - name: Build project
        env:
          VITE_THANK_YOU_URL_KEY: ${{ secrets.VITE_THANK_YOU_URL_KEY }}
        run: npm run build

      - name: Verify sitemap deploy artifact
        run: node scripts/check-sitemap-artifact.mjs

      - name: Debug Wrangler environment
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          npx --yes wrangler --version

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy ./dist --project-name=wave-link-cards --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Purge edge cache for routing URLs
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -e
          purge_zone() {
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"files":["https://getwaved.ai/","https://getwaved.ai/m","https://getwaved.ai/m/"]}'
          }
          if [ -n "$CLOUDFLARE_ZONE_ID" ]; then
            purge_zone
            echo "Purged via CLOUDFLARE_ZONE_ID."
          else
            echo "CLOUDFLARE_ZONE_ID not set — resolving zone for getwaved.ai..."
            ZONE_ID=$(curl -fsS -G "https://api.cloudflare.com/client/v4/zones" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --data-urlencode "name=getwaved.ai" \
              --data-urlencode "account.id=${CLOUDFLARE_ACCOUNT_ID}" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);const z=j.result&&j.result[0]&&j.result[0].id;if(!z){process.exit(1)};process.stdout.write(z)})")
            CLOUDFLARE_ZONE_ID="$ZONE_ID" purge_zone
            echo "Purged via resolved zone ${ZONE_ID}."
          fi
          sleep 25

      - name: Verify production mobile redirects (post-deploy)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: node scripts/verify-mobile-redirects.mjs --live
