name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    # PRs still run build + verify; production deploy only on pushes to main (see step if:).
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify mobile routing rules (unit + chain, no production fetch)
        run: node scripts/verify-mobile-redirects.mjs

      - name: Verify build uses JS Vite (not Debian /usr/bin/vite)
        run: node scripts/npm-scripts-verify.mjs ci

      - name: Build project
        env:
          VITE_THANK_YOU_URL_KEY: ${{ secrets.VITE_THANK_YOU_URL_KEY }}
        run: npm run build

      - name: Verify sitemap deploy artifact
        run: node scripts/check-sitemap-artifact.mjs

      - name: Debug Wrangler environment
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          npx --yes wrangler --version

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy ./dist --project-name=wave-link-cards --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
